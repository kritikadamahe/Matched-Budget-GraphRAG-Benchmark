# FREE-TIER PILOT via Gemini (pipeline check only; do NOT report these scores as results).
# PAID PILOT (Blueprint §R minimum viable experiment): HotpotQA, 20 questions,
# Random vs KET-RAG at 10% and 100% budget = 4 conditions. Costs a few cents.
#   python -m experiments.run --config configs/pilot_hotpotqa.yaml --dry-run          # free estimate
#   python -m experiments.run --config configs/pilot_hotpotqa.yaml --confirm-paid --max-total-usd 0.50
# Checks: (1) both strategies give identical scores at 100%, (2) a re-run makes 0 new paid calls.
experiment_id: pilot_hotpotqa_free
seed: 42

dataset: hotpotqa
strategy: random
budget: 0.10

data_source: huggingface
num_questions: 20

chunk_size_words: 250
chunk_overlap_words: 40

embedding_backend: sentence-transformers
ketrag_mode: faithful

extraction_backend: openai
generation_backend: openai
judge_backend: openai
extraction_max_cost_usd: 0.50
extraction_max_retries: 6
generation_max_retries: 6
judge_max_retries: 6
extraction_model: gemini-3.1-flash-lite
generation_model: gemini-3.1-flash-lite
judge_model: gemini-3.1-flash-lite
extraction_price_input_per_1m: 0
extraction_price_output_per_1m: 0
generation_price_input_per_1m: 0
generation_price_output_per_1m: 0
judge_price_input_per_1m: 0
judge_price_output_per_1m: 0

cache_dir: cache
output_dir: results

matrix:
  datasets: [hotpotqa]
  strategies: [random, ketrag]
  budgets: [0.10, 1.0]
