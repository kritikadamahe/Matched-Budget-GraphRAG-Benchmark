# SMOKE TEST - 3 questions, 4 conditions: measures real Cerebras token sizes (~50K tokens). Not results.
experiment_id: smoke_cerebras
seed: 42

dataset: hotpotqa
strategy: random
budget: 0.10

data_source: huggingface
num_questions: 3

chunk_size_words: 250
chunk_overlap_words: 40

embedding_backend: sentence-transformers
ketrag_mode: faithful
retrieval_max_context_words: 700

extraction_backend: openai
generation_backend: openai
judge_backend: openai
extraction_model: qwen-3.8-27b
generation_model: qwen-3.8-27b
judge_model: gpt-oss-120b                 # different from the generator (self-preference bias)
extraction_reasoning_effort: none
generation_reasoning_effort: none
judge_reasoning_effort: low
extraction_max_retries: 6
generation_max_retries: 6
judge_max_retries: 6
extraction_max_cost_usd: 0.50
# Cerebras trial credit: prices left at 0 until checked on the pricing page, so --max-total-usd does NOT
# protect the credit yet. Token usage is still recorded exactly.
extraction_price_input_per_1m: 0
extraction_price_output_per_1m: 0
generation_price_input_per_1m: 0
generation_price_output_per_1m: 0
judge_price_input_per_1m: 0
judge_price_output_per_1m: 0

cache_dir: cache
output_dir: results

matrix:
  datasets: [hotpotqa]
  strategies: [random, ketrag]
  budgets: [0.10, 1.0]
